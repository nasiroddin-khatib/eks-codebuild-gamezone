version: 0.2

phases:

  pre_build:
    commands:
      - echo Logging into Amazon ECR...
      - aws ecr get-login-password --region ap-south-1 | docker login --username AWS --password-stdin 245246852393.dkr.ecr.ap-south-1.amazonaws.com

      - IMAGE_TAG="latest"

  build:
    commands:
      - echo Build started
      - docker build -t gamezone:$IMAGE_TAG .

      - docker tag gamezone:$IMAGE_TAG 245246852393.dkr.ecr.ap-south-1.amazonaws.com/gamezone:$IMAGE_TAG

  post_build:
    commands:
      - echo Pushing Docker image...
      - docker push 245246852393.dkr.ecr.ap-south-1.amazonaws.com/gamezone:$IMAGE_TAG

