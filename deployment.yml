apiVersion: apps/v1
kind: Deployment

metadata:
  name: gamezone-deployment

spec:
  replicas: 2

  selector:
    matchLabels:
      app: gamezone

  template:
    metadata:
      labels:
        app: gamezone

    spec:
      containers:
      - name: gamezone-container

        image: IMAGE_URI

        ports:
        - containerPort: 80
